name: Kalender aktualisieren

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: iCal-Datei erzeugen
        env:
          CITY_ID: ${{ vars.CITY_ID }}
          AREA_ID: ${{ vars.AREA_ID }}
        run: python make_ics.py
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/muell.ics
          git diff --cached --quiet || (git commit -m "Abfuhrtermine aktualisiert" && git push)
